_config_path: configs/colon_pilot.yaml

study:
  name: safe-fusion-colon-epithelial-donor-benchmark
  seed: 1729
  results_root: artifacts/colon_runs
  bootstrap_replicates: 2000
  primary_endpoint: log1p_mae
  minimum_relative_improvement: 0.05
  fill_budgets: [0.02, 0.05, 0.081, 0.10]

datasets:
  synthetic_smoke: {enabled: false}
  cbmc: {enabled: false}
  pbmc: {enabled: false}
  mnc: {enabled: false}
  crohn: {enabled: false}
  zebrafish: {enabled: false}
  eccite_ko: {enabled: false}
  norman_crispra: {enabled: false}
  adamson_crispri: {enabled: false}
  colon_epithelial:
    enabled: true
    accession: CELLxGENE-63ff2c52-cb63-44f0-bac3-d0b33373e312
    publication_doi: 10.1016/j.immuni.2023.01.002
    role: nonimmune_downstream_primary
    biological_unit: donor
    source: external_data/prepared/colon_epithelial.h5ad
    expected_sha256: 532261970fca1061cd00883054c86858ffdfd37e863e13a56e6ff5c2f7f6896f

split:
  development_fraction: 0.50
  validation_fraction: 0.25
  test_fraction: 0.25
  lock_test: true

corruptions:
  thinning_025: {kind: binomial_thinning, retained_fraction: 0.25}
  thinning_050: {kind: binomial_thinning, retained_fraction: 0.50}
  mask_010: {kind: stratified_nonzero_mask, fraction: 0.10, gene_bins: 4, library_bins: 4}

methods:
  raw: {enabled: true, family: no_imputation, runner: builtin}
  gene_mean: {enabled: true, family: simple, runner: builtin}
  gene_median: {enabled: true, family: simple, runner: builtin}
  random_fill: {enabled: true, family: negative_control, runner: builtin}
  svd_impute:
    enabled: true
    family: low_rank
    runner: external
    version: parent-repository-frozen
    command:
      - python
      - scripts/run_leakage_safe_method.py
      - --method
      - svd_impute
      - --input
      - "{input}"
      - --coordinates
      - "{coordinates}"
      - --splits
      - "{splits}"
      - --output
      - "{output}"
      - --seed
      - "{seed}"
  graph_smooth:
    enabled: true
    family: knn_smoothing
    runner: external
    version: parent-repository-frozen
    command:
      - python
      - scripts/run_leakage_safe_method.py
      - --method
      - graph_smooth
      - --input
      - "{input}"
      - --coordinates
      - "{coordinates}"
      - --splits
      - "{splits}"
      - --output
      - "{output}"
      - --seed
      - "{seed}"
  safe_fusion: {enabled: false}
  alra: {enabled: false}
  scgcl: {enabled: false}
  saver: {enabled: false}
  scgpt: {enabled: false}
  scvi: {enabled: false}
  magic: {enabled: false}
  dca: {enabled: false}
  safe_fusion_no_gate: {enabled: false}
  safe_fusion_gate_no_fallback: {enabled: false}
  safe_fusion_random_gate: {enabled: false}
  safe_fusion_variance_shuffled: {enabled: false}
  safe_fusion_no_scvi: {enabled: false}
  scvi_fallback_only: {enabled: false}

perturbation:
  effective_classes: [KO]
  forbidden_effective_classes: [NP, NT]
  protein_readouts: {PD-L1: CD274, PD-L2: PDCD1LG2, CD86: CD86}
  exclude_same_gene_perturbations: true
